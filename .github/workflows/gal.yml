name: gal

on:
  # 仅手动触发, 节省 token; 走 GitHub Pages 部署, 跑完直接访问
  workflow_dispatch:

# Pages 部署需要: 读仓库, 写 Pages, OIDC 部署
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Overview gal docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # python-github-backup 需要完整历史
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install libmagic
        # Asset Pack MIME 校验依赖 libmagic, 不装会失败
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install Repo2Gal
        run: |
          python -m venv .venv
          # repo2gal 没发到 PyPI, 从 GitHub pin commit 装, 避免 upstream main 改动导致 CI 挂
          .venv/bin/pip install --quiet "git+https://github.com/RhoPaper/Repo2Gal.git@53d1f2fa6ebcdf6bcf882308daee321bbc869db0"

      - name: Generate Overview gal docs
        env:
          # GitHub Actions 默认提供的 token, 用于 REST 抓取
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # LLM 鉴权: gal 走 DeepSeek, 与 reviewer CI (走 minimaxi) 解耦, 各自独立 secret
          REPO2GAL_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # DeepSeek 官方 OpenAI 兼容端点; minimaxi 第三轮长生成易 RST, 切到 DeepSeek 更稳
          REPO2GAL_BASE_URL: https://api.deepseek.com
          REPO2GAL_MODEL: deepseek-flash
        run: |
          .venv/bin/repo2gal ${{ github.repository }} \
            --mode overview \
            --asset-pack builtin:cc0-chronicle \
            --public-assets \
            --timeout 600

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Repo2Gal 默认产物目录是 output/<repo>-overview,
          # 仓库名带下划线, 路径也跟着带
          path: output/weihuda_weapp_tsumiki_gal-overview

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4